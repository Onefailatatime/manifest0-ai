# Runs the type-check and the tests on every push and pull request.
# Tests use a local D1/R2 inside the Workers runtime: no Cloudflare account, Muse key or Resend key needed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
