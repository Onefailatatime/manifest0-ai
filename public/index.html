<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041D3E">
<title>Manifest0-Ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<!-- Brand colors from Jessyka's design: navy (light), steel gray (dark), hazard yellow. -->
<link rel="stylesheet" href="tokens.css">
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),s=null;try{s=localStorage.getItem('m0-theme')}catch(e){}
var t=q||s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{--m0-hazard:#F3BF2B;--m0-on-hazard:#111111;--m0-bg:#FFFFFF;--m0-line:#E3E6EA;
 --m0-info-bg:#E8EEFB;--m0-info:#1C5FE4;--m0-hot-bg:#FDEEE0;--m0-hot:#C2410C}
[data-theme=dark]{--m0-bg:#252C32;--m0-line:#3B444B;--m0-info-bg:#343D43;--m0-info:#C9CED4;--m0-hot-bg:#3B2A14;--m0-hot:#FDBA74}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--m0-bg:#252C32;--m0-line:#3B444B;--m0-info-bg:#343D43;--m0-info:#C9CED4;--m0-hot-bg:#3B2A14;--m0-hot:#FDBA74}}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--m0-font-sans);font-size:var(--m0-fs-body);line-height:var(--m0-lh-body);color:var(--m0-text);background:var(--m0-bg);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--m0-focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.wrap{max-width:var(--m0-content-max);margin:0 auto;padding-bottom:120px}

/* top bar: navy in light, steel in dark */
.top{background:var(--m0-header);color:var(--m0-on-header);padding:calc(12px + env(safe-area-inset-top)) var(--m0-gutter) 18px}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:var(--m0-tap)}
.mark{font-weight:600;font-size:1.0625rem;letter-spacing:-.01em;background:none;border:0;padding:0;color:inherit}
.mark b{color:var(--m0-hazard);font-weight:600}
.icon-btn{width:var(--m0-tap);height:var(--m0-tap);border:0;background:none;color:inherit;font-size:22px;display:grid;place-items:center;border-radius:999px;margin-right:-10px}
.site{font-size:var(--m0-fs-xs);opacity:.75;margin-top:10px}
.where{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.where h1{font-size:1.375rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.link{background:none;border:0;padding:6px 0;color:var(--m0-hazard);font-size:var(--m0-fs-sm);font-weight:500;white-space:nowrap}

main{padding:0 var(--m0-gutter)}

/* setup form */
.lbl{display:block;font-size:var(--m0-fs-sm);font-weight:500;margin-top:18px}
.lbl span{font-weight:400;color:var(--m0-text-2)}
.field{width:100%;height:var(--m0-input-h);margin-top:6px;padding:0 12px;border-radius:var(--m0-radius-md);border:1px solid var(--m0-border-strong);background:var(--m0-surface);color:var(--m0-text);font-size:16px}
input::placeholder{color:var(--m0-text-muted)}
.field[aria-invalid=true]{border-color:var(--m0-error);border-width:2px}
.hint{font-size:var(--m0-fs-xs);color:var(--m0-text-2);margin-top:6px}
.err{font-size:var(--m0-fs-xs);color:var(--m0-error);margin-top:6px;font-weight:500}
.intro{font-size:var(--m0-fs-sm);color:var(--m0-text-2);margin-top:16px}

/* the yellow camera button */
.snap{display:flex;align-items:center;gap:12px;width:100%;margin:16px 0 4px;padding:14px;border:0;border-radius:var(--m0-radius-lg);background:var(--m0-hazard);color:var(--m0-on-hazard);text-align:left}
.snap .dot{width:46px;height:46px;border-radius:50%;background:var(--m0-on-hazard);color:var(--m0-hazard);display:grid;place-items:center;font-size:24px;flex:0 0 46px}
.snap b{display:block;font-size:1.0625rem;font-weight:600}
.snap span{font-size:var(--m0-fs-sm)}

/* photos picked, not yet sent */
.tray{margin-top:8px;padding:10px;border:1px solid var(--m0-line);border-radius:var(--m0-radius-lg)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.th{position:relative;flex:0 0 56px;height:56px;border-radius:8px;overflow:hidden;background:var(--m0-surface-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:grid;place-items:center;padding:0}
.tray .go{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:var(--m0-fs-sm)}
.btn{min-height:var(--m0-tap);border-radius:var(--m0-radius-md);font-weight:600;font-size:var(--m0-fs-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border:1px solid var(--m0-border-strong);background:var(--m0-surface);color:var(--m0-text);text-decoration:none}
.btn.dark{background:var(--m0-primary);color:var(--m0-on-primary);border-color:transparent}
.btn.danger{background:var(--m0-error-bg);color:var(--m0-error);border-color:transparent}
.btn.ok{background:var(--m0-success-bg);color:var(--m0-success);border-color:transparent}
.btn.wide{width:100%}

/* status line while Muse works */
.status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--m0-fs-sm);color:var(--m0-text-2)}
.status i{font-size:18px}
.spin{animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{margin-top:16px;padding:12px;border-radius:var(--m0-radius-md);font-size:var(--m0-fs-sm);background:var(--m0-success-bg);color:var(--m0-success)}
.banner.warn{background:var(--m0-warning-bg);color:var(--m0-warning)}
.banner.bad{background:var(--m0-error-bg);color:var(--m0-error)}
.banner a{color:inherit;font-weight:600}

/* inventory list */
.count{font-size:var(--m0-fs-xs);color:var(--m0-text-2);margin:20px 0 2px;display:flex;justify-content:space-between}
.room{font-size:var(--m0-fs-xs);font-weight:600;color:var(--m0-text-2);margin:14px 0 0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--m0-line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:0 0 36px;font-size:19px;background:var(--m0-info-bg);color:var(--m0-info)}
.ic.hot{background:var(--m0-hot-bg);color:var(--m0-hot)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:var(--m0-fs-xs);color:var(--m0-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;align-items:center}
.chip{font:500 11px var(--m0-font-mono);border-radius:5px;padding:2px 6px;white-space:nowrap;background:var(--m0-success-bg);color:var(--m0-success)}
.chip.wait{background:var(--m0-surface-2);color:var(--m0-text-2)}
.chip.hot{background:var(--m0-hot-bg);color:var(--m0-hot)}
.chip.bad{background:var(--m0-error-bg);color:var(--m0-error)}
.ok-mark{color:var(--m0-success);font-size:16px}
.empty{text-align:center;color:var(--m0-text-2);font-size:var(--m0-fs-sm);padding:28px 0}

/* bottom button */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--m0-bg);border-top:1px solid var(--m0-line);padding:10px var(--m0-gutter) calc(10px + env(safe-area-inset-bottom))}
.sticky .in{max-width:var(--m0-content-max);margin:0 auto}
.primary{width:100%;min-height:var(--m0-btn-h);border-radius:var(--m0-radius-md);border:0;background:var(--m0-primary);color:var(--m0-on-primary);font-size:1.0625rem;font-weight:600}
[data-theme=dark] .primary{background:transparent;color:var(--m0-hazard);border:1.5px solid var(--m0-hazard)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .primary{background:transparent;color:var(--m0-hazard);border:1.5px solid var(--m0-hazard)}}
.primary[aria-disabled=true]{opacity:.4}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:var(--m0-content-max);margin:0 auto;background:var(--m0-bg);border-radius:18px 18px 0 0;padding:8px var(--m0-gutter) calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:999px;background:var(--m0-border-strong);margin:4px auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.sheet-head h2{font-size:var(--m0-fs-h3);font-weight:600;line-height:1.3;padding-top:8px}
.close{width:var(--m0-tap);height:var(--m0-tap);border-radius:999px;border:0;background:var(--m0-surface-2);font-size:20px;flex:0 0 auto;display:grid;place-items:center}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:var(--m0-fs-sm);margin:4px 0 16px}
dt{color:var(--m0-text-2)}dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
dd small{display:block;font-weight:400;color:var(--m0-text-2)}
.photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.photos a{flex:0 0 72px;height:72px;border-radius:8px;overflow:hidden;background:var(--m0-surface-2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.edit{border:1px solid var(--m0-line);border-radius:var(--m0-radius-md);padding:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit label{font-size:var(--m0-fs-xs);color:var(--m0-text-2);display:block}
.edit .field{margin-top:4px;height:44px}
.edit .code{margin-top:10px;font-size:var(--m0-fs-sm)}
.edit .code b{font-family:var(--m0-font-mono)}
.stack{display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chiprow button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--m0-border-strong);background:var(--m0-surface);font-size:var(--m0-fs-sm)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;background:var(--m0-text);color:var(--m0-bg);padding:10px 14px;border-radius:var(--m0-radius-md);font-size:var(--m0-fs-sm);font-weight:500;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
body.lock .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:var(--m0-tap);padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <button class="mark" id="markBtn">Manifest0<b>-Ai</b></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme"><i class="ti ti-moon"></i></button>
    </div>
    <div class="site" id="siteLine">New walk</div>
    <div class="where"><h1 id="roomTitle">Start a site walk</h1><button class="link" id="roomBtn" hidden>Change room</button></div>
  </header>

  <main>
    <!-- before the walk starts -->
    <section id="setup">
      <p class="intro">Snap each label room by room. Muse builds the inventory, finds every SDS and emails the report to your client.</p>
      <label class="lbl" for="site">Site name <span>(optional)</span></label>
      <input id="site" class="field" type="text" autocomplete="off" placeholder="Riverside Clinic">
      <label class="lbl" for="room">First room</label>
      <input id="room" class="field" type="text" autocomplete="off" placeholder="Janitor closet">
      <label class="lbl" for="me">Your email</label>
      <input id="me" class="field" type="email" inputmode="email" autocomplete="email" placeholder="you@company.com">
      <label class="lbl" for="client">Client email</label>
      <input id="client" class="field" type="email" inputmode="email" multiple placeholder="client@site.com">
      <div class="hint">You get a copy. Separate several client addresses with commas.</div>
      <div class="err" id="setupErr" role="alert" hidden></div>
    </section>

    <!-- during the walk -->
    <section id="walk" hidden>
      <div id="capture">
        <button class="snap" id="snapBtn"><span class="dot"><i class="ti ti-camera"></i></span><span><b>Snap a label</b><span>One photo per label. For a packed box, the box and one item.</span></span></button>
        <div class="tray" id="tray" hidden>
          <div class="thumbs" id="thumbs"></div>
          <div class="go"><span id="trayText"></span><button class="btn dark" id="readBtn"><i class="ti ti-send"></i> Read photos</button></div>
        </div>
      </div>
      <input class="sr" type="file" id="photoCam" accept="image/*" capture="environment">
      <div class="status" id="status" hidden><i class="ti ti-loader-2 spin"></i><span id="statusText"></span></div>
      <div class="banner" id="banner" hidden></div>
      <div class="count" id="count"></div>
      <div id="rows"></div>
    </section>
  </main>
</div>

<div class="sticky"><div class="in"><button class="primary" id="mainBtn">Start walk</button></div></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" aria-label="Close"><i class="ti ti-x"></i></button></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(()=>{
const $=s=>document.querySelector(s), root=document.documentElement;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const RE=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]{2,}$/;
const emails=v=>v.split(/[,;\s]+/).map(s=>s.trim()).filter(Boolean);

/* ---------- toast ---------- */
let tt;function toast(msg,act,fn){$('#toastMsg').textContent=msg;const a=$('#toastAct');
 if(act){a.hidden=false;a.textContent=act;a.onclick=()=>{fn();hideT()}}else a.hidden=true;
 $('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(hideT,act?5000:2800)}
function hideT(){$('#toast').classList.remove('show')}

/* ---------- theme ---------- */
function syncTheme(){const d=root.getAttribute('data-theme')==='dark';$('#themeBtn').innerHTML=`<i class="ti ti-${d?'sun':'moon'}"></i>`;
 document.querySelector('meta[name=theme-color]').content=d?'#252C32':'#041D3E'}
$('#themeBtn').onclick=()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);store.set('m0-theme',n);syncTheme()};
syncTheme();
$('#markBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* ---------- bottom sheet ---------- */
let lastFocus=null,sheetFor=null,sheetGen=0;
function openSheet(title,html,forId){hideT();if($('#sheet').hidden)lastFocus=document.activeElement;sheetFor=forId||null;sheetGen++;
 $('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;
 const sc=$('#scrim'),sh=$('#sheet');sc.hidden=false;sh.hidden=false;document.body.classList.add('lock');
 requestAnimationFrame(()=>{sc.classList.add('show');sh.classList.add('show')})}
function closeSheet(){const sc=$('#scrim'),sh=$('#sheet');sc.classList.remove('show');sh.classList.remove('show');
 document.body.classList.remove('lock');sheetFor=null;const gen=sheetGen;
 setTimeout(()=>{if(gen!==sheetGen)return;sc.hidden=true;sh.hidden=true;$('#sheetBody').innerHTML=''},250);
 if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('#sheetClose').onclick=closeSheet;$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- state ---------- */
let visitId=new URLSearchParams(location.search).get('visit'), data=null, room=store.get('m0-room')||'';
let tray=[], uid=0, uploading=0, pollTimer=null, lastRows='';
const isOpen=()=>!data||data.visit.status==='open';
const sdsPending=()=>data?data.products.filter(p=>p.sds_status==='pending').length:0;
const busy=()=>uploading>0||!!data&&(data.photos.pending>0||sdsPending()>0||data.visit.status==='finishing');
$('#me').value=store.get('m0-me')||'';

async function api(path,opts){const r=await fetch(path,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong ('+r.status+')');return j}
async function load(){if(!visitId)return render();
 try{data=await api('/api/visits/'+visitId)}catch(e){toast(e.message);return}
 render();clearTimeout(pollTimer);if(busy())pollTimer=setTimeout(load,2500)}

/* ---------- start the walk ---------- */
async function startWalk(){
 const me=$('#me').value.trim(),clients=emails($('#client').value),r=$('#room').value.trim();
 const bad=!RE.test(me)?'Enter your email.':!clients.length?'Enter the client email.':clients.find(e=>!RE.test(e))?'Check this address: '+clients.find(e=>!RE.test(e)):!r?'Enter the first room.':'';
 $('#me').setAttribute('aria-invalid',!RE.test(me));$('#client').setAttribute('aria-invalid',!clients.length||clients.some(e=>!RE.test(e)));$('#room').setAttribute('aria-invalid',!r);
 $('#setupErr').hidden=!bad;$('#setupErr').textContent=bad;if(bad)return;
 try{const res=await api('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipients:[me,...clients],siteName:$('#site').value})});
  visitId=res.visitId;store.set('m0-me',me);setRoom(r);history.replaceState(null,'','?visit='+visitId);await load()}
 catch(e){toast(e.message)}}

function setRoom(r){room=r;store.set('m0-room',r);render()}
function changeRoom(){
 const rooms=data?[...new Set(data.products.map(p=>p.room))].filter(x=>x!==room):[];
 openSheet('Which room?',`<input id="newRoom" class="field" type="text" autocomplete="off" placeholder="Room name" value="">
  ${rooms.length?`<div class="chiprow">${rooms.map(r=>`<button data-room="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}
  <button class="btn dark wide" id="roomOk" style="margin-top:14px">Go to room</button>`);
 const go=v=>{v=v.trim();if(!v){$('#newRoom').focus();return}closeSheet();setRoom(v);toast('Now in '+v)};
 $('#roomOk').onclick=()=>go($('#newRoom').value);$('#newRoom').addEventListener('keydown',e=>{if(e.key==='Enter')go($('#newRoom').value)});
 document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>go(b.dataset.room));setTimeout(()=>$('#newRoom').focus(),300)}
$('#roomBtn').onclick=changeRoom;

/* ---------- photos ---------- */
$('#snapBtn').onclick=()=>$('#photoCam').click();
$('#photoCam').addEventListener('change',e=>{addPhotos(e.target.files);e.target.value=''});
function addPhotos(list){for(const f of list){if(!(f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)))continue;
 tray.push({id:++uid,file:f,url:URL.createObjectURL(f)})}renderTray()}
function renderTray(){$('#tray').hidden=!tray.length;
 $('#thumbs').innerHTML=tray.map(t=>`<div class="th"><img src="${t.url}" alt=""><button data-id="${t.id}" aria-label="Remove photo"><i class="ti ti-x"></i></button></div>`).join('');
 $('#trayText').textContent=plural(tray.length,'photo')+' in '+room}
$('#thumbs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=tray.find(x=>x.id===+b.dataset.id);
 tray=tray.filter(x=>x!==t);URL.revokeObjectURL(t.url);renderTray()});

/* Phone photos are 3-5 MB; shrink to 2000px JPEG before upload (labels stay readable). */
async function shrink(file){
 if(file.size<1.5e6)return file;
 try{const bmp=await createImageBitmap(file),s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  return blob?new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}
 catch(e){return file}}

$('#readBtn').onclick=async()=>{
 const batch=tray,r=room;tray=[];renderTray();uploading+=batch.length;render();
 try{for(let i=0;i<batch.length;i+=12){   // the server takes up to 12 photos per upload
   const fd=new FormData();fd.append('room',r);
   for(const t of batch.slice(i,i+12))fd.append('images',await shrink(t.file));
   await api(`/api/visits/${visitId}/photos`,{method:'POST',body:fd})}
  batch.forEach(t=>URL.revokeObjectURL(t.url))}
 catch(e){tray=batch.concat(tray);renderTray();toast(e.message)}
 uploading-=batch.length;await load()};

/* ---------- product edits ---------- */
async function patch(id,body,msg){
 try{await api('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(msg)toast(msg);await load();return true}
 catch(e){toast(e.message);return false}}

/* ---------- send report ---------- */
function sendReport(){
 const n=data.products.length,unchecked=data.products.filter(p=>!p.confirmed).length,list=JSON.parse(data.visit.recipients||'[]');
 openSheet('Send the report?',`<p style="font-size:14px">${plural(n,'product')} and their SDS sheets go to <b>${esc(list.slice(1).join(', ')||list[0])}</b>${list.length>1?', with a copy to you':''}.</p>
  <ul style="font-size:14px;margin:10px 0 16px 18px;color:var(--m0-text-2)">
  ${busy()?'<li>Muse is still working. The email goes out as soon as it finishes.</li>':''}
  ${unchecked?`<li>${plural(unchecked,'item')} not confirmed yet.</li>`:''}
  <li>After sending, the inventory can't be changed.</li></ul>
  <div class="grid2"><button class="btn" id="eNo">Not yet</button><button class="btn dark" id="eYes"><i class="ti ti-send"></i> Send</button></div>`);
 $('#eNo').onclick=closeSheet;
 $('#eYes').onclick=async()=>{closeSheet();try{await api(`/api/visits/${visitId}/finish`,{method:'POST'});await load()}catch(e){toast(e.message)}}}

function newWalk(){
 clearTimeout(pollTimer);visitId=null;data=null;lastRows='';tray.forEach(t=>URL.revokeObjectURL(t.url));tray=[];
 history.replaceState(null,'',location.pathname);$('#site').value='';$('#room').value='';$('#client').value='';
 renderTray();render();window.scrollTo({top:0})}

/* ---------- rendering ---------- */
const ICON={drum:'barrel',tote:'barrel',pail:'bucket',jug:'bottle',bottle:'bottle',can:'spray',aerosol:'spray',box:'box',bag:'shopping-bag',cylinder:'cylinder',tube:'droplet',other:'flask'};
const TYPES=['drum','pail','jug','bottle','can','aerosol','box','bag','tote','cylinder','tube','other'];
const MATERIALS=['metal','plastic','fiber','wood','glass','unknown'];
const hot=p=>!!p.hazard_class||p.signal_word==='DANGER';
const contents=p=>p.inner_type||p.inner_count!=null?`${p.inner_count!=null?'~'+p.inner_count+' ':''}${p.inner_type?p.inner_type+'s':'items'}`:'';
const shortSize=s=>s?s.split(/[(\n]/)[0].trim():'';
const summary=p=>[`${p.quantity} ${p.container_type==='other'?'container':p.container_type}${p.quantity>1?'s':''}`,contents(p),!contents(p)&&shortSize(p.container_size)].filter(Boolean).join(' · ');
const classChip=p=>p.hazard_class?`<span class="chip hot">CL ${esc(p.hazard_class.split(/\s/)[0])}</span>`:'';
const sdsChip=p=>({pending:'<span class="chip wait">SDS…</span>',found:'<span class="chip">SDS</span>',page_only:'<span class="chip wait">SDS page</span>',not_found:'<span class="chip bad">No SDS</span>'}[p.sds_status]||'');

function render(){
 const v=data&&data.visit,open=isOpen(),walking=!!visitId;
 $('#setup').hidden=walking;$('#walk').hidden=!walking;
 $('#siteLine').textContent=walking?(v&&v.site_name)||'Site walk':'New walk';
 $('#roomTitle').textContent=walking?(open?room||'Choose a room':(v.status==='done'?(v.email_sent_at?'Report sent':'Report saved'):v.status==='failed'?'Report not sent':'Sending report')):'Start a site walk';
 $('#roomBtn').hidden=!walking||!open;$('#capture').hidden=!walking||!open;
 if(walking&&open&&!room)$('#roomTitle').textContent='Choose a room';

 // status line
 const reading=data?data.photos.pending:0,sds=sdsPending();
 const st=uploading?`Uploading ${plural(uploading,'photo')}…`:reading?`Reading ${plural(reading,'label photo')}…`:sds?`Finding ${plural(sds,'SDS sheet')}…`:v&&v.status==='finishing'?'Sending the report…':'';
 $('#status').hidden=!st;$('#statusText').textContent=st;

 // result banner
 const saved=data&&data.log.map(l=>l.match(/Report: (\/api\/files\/\S+)/)).filter(Boolean).at(-1),bn=$('#banner');
 bn.hidden=true;
 if(v&&v.status==='done'){bn.hidden=false;bn.className='banner';const list=JSON.parse(v.recipients||'[]');
  bn.innerHTML=v.email_sent_at?`<i class="ti ti-circle-check"></i> Report emailed to ${esc(list.join(', '))}.`
   :saved?`Email isn't set up yet, so the report was saved: <a href="${esc(saved[1])}" target="_blank">open report</a>.`:'Report done.'}
 else if(v&&v.status==='failed'){bn.hidden=false;bn.className='banner bad';bn.textContent="The email didn't go out: "+v.error}

 // inventory
 const products=data?data.products:[];
 $('#count').innerHTML=walking?`<span>${plural(products.length,'product')}</span>${products.length&&open?'<span>Tap to check</span>':''}`:'';
 const snap=JSON.stringify(products)+open;
 if(walking&&snap!==lastRows){lastRows=snap;let html='',r=null;const rooms=new Set(products.map(p=>p.room)).size;
  for(const p of products){if(rooms>1&&p.room!==r){r=p.room;html+=`<div class="room">${esc(r)}</div>`}
   html+=`<button class="row" data-id="${p.id}"><span class="ic${hot(p)?' hot':''}"><i class="ti ti-${hot(p)&&p.hazard_class&&/^(3|2\.1|4)/.test(p.hazard_class)?'flame':ICON[p.container_type]||'flask'}"></i></span>
    <span class="t"><b>${esc(p.product_name)}</b><span>${esc(summary(p))}</span></span>
    <span class="chips">${p.confirmed?'<i class="ti ti-circle-check ok-mark" aria-label="Confirmed"></i>':''}${classChip(p)}${sdsChip(p)}</span></button>`}
  $('#rows').innerHTML=html||(open?'<div class="empty">Snap the first label to start the list.</div>':'')}
 update()}

/* bottom button: Start walk → Send to client → Start new walk */
let mode='start';
function update(){const b=$('#mainBtn');
 if(!visitId){mode='start';b.textContent='Start walk';b.setAttribute('aria-disabled',false);return}
 if(isOpen()){mode='send';b.textContent='Send to client';b.setAttribute('aria-disabled',!(data&&data.products.length));return}
 mode='new';b.textContent='Start new walk';b.setAttribute('aria-disabled',false)}
$('#mainBtn').onclick=()=>{if(mode==='start')startWalk();else if(mode==='send')data&&data.products.length?sendReport():toast('Snap a label first');else newWalk()};

/* ---------- product sheet ---------- */
$('#rows').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)detail(b.dataset.id)});
function detail(id){
 const p=data.products.find(x=>x.id===id);if(!p)return;const open=isOpen();
 const ing=JSON.parse(p.ingredients),haz=JSON.parse(p.hazard_statements),photos=JSON.parse(p.photo_keys);
 const m=p.manifest||{},packed=p.inner_type||p.container_type==='box'||p.container_type==='drum';
 const sdsLink=p.sds_key?`/api/files/${p.sds_key}`:p.sds_page_url||p.sds_url;
 const sdsText={pending:'Searching…',found:p.sds_source==='library'?'Found (saved from an earlier visit)':'Found',page_only:'Manufacturer page only',not_found:'Not found'}[p.sds_status];
 const opt=(list,cur)=>list.map(x=>`<option${x===cur?' selected':''}>${x}</option>`).join('');
 openSheet(p.product_name,`
  ${photos.length?`<div class="photos">${photos.map(k=>`<a href="/api/files/${encodeURI(k)}" target="_blank"><img src="/api/files/${encodeURI(k)}" alt="Label photo" loading="lazy"></a>`).join('')}</div>`:''}
  <dl>
   ${p.manufacturer?`<dt>Maker</dt><dd>${esc(p.manufacturer)}</dd>`:''}
   <dt>Ingredients</dt><dd>${ing.length?ing.map(esc).join('<br>'):'Not on label'}</dd>
   <dt>Hazard class</dt><dd>${p.hazard_class?esc(p.hazard_class):'Not clear from label'}${p.un_number?' · '+esc(p.un_number):''}</dd>
   ${p.signal_word&&p.signal_word!=='none'?`<dt>Signal word</dt><dd>${esc(p.signal_word)}</dd>`:''}
   ${haz.length?`<dt>Hazards</dt><dd><small>${haz.map(esc).join('<br>')}</small></dd>`:''}
   <dt>Room</dt><dd>${esc(p.room)}</dd>
   <dt>SDS</dt><dd>${esc(sdsText)}</dd>
  </dl>
  ${open?`<div class="edit">
   <div class="grid2"><div><label for="eQty">Containers</label><input id="eQty" class="field" type="number" min="1" inputmode="numeric" value="${p.quantity}"></div>
    <div><label for="eType">Type</label><select id="eType" class="field">${opt(TYPES,p.container_type)}</select></div>
    <div><label for="eMat">Material</label><select id="eMat" class="field">${opt(MATERIALS,p.container_material)}</select></div>
    ${packed?`<div><label for="eInner">Items inside</label><input id="eInner" class="field" type="number" min="0" inputmode="numeric" value="${p.inner_count??''}" placeholder="none"></div>`:''}</div>
   <div class="code">${esc([shortSize(p.container_size),contents(p)&&'contains '+contents(p)].filter(Boolean).join(' · '))}
    <div style="margin-top:4px">EPA manifest: ${m.code?`<b>${p.quantity} ${esc(m.code)}</b>`:`<span style="color:var(--m0-text-2)">${esc(m.hint)}</span>`}${p.count_edited?' · edited':''}</div>
    ${p.count_note?`<div class="hint">${esc(p.count_note)}</div>`:''}</div>
  </div>`:`<dl style="margin-top:-8px"><dt>Containers</dt><dd>${esc(summary(p))}</dd>
   <dt>EPA manifest</dt><dd>${m.code?esc(p.quantity+' '+m.code):'<small>'+esc(m.hint)+'</small>'}</dd></dl>`}
  <div class="stack">
   ${sdsLink?`<a class="btn wide" href="${esc(sdsLink)}" target="_blank" rel="noopener"><i class="ti ti-file-text"></i> ${p.sds_key?'View SDS':'Open SDS page'}</a>`:''}
   ${open?`<div class="grid2"><button class="btn danger" id="dRm"><i class="ti ti-trash"></i> Remove</button><button class="btn ok" id="dOk"><i class="ti ti-check"></i> ${p.confirmed?'Unconfirm':'Confirm'}</button></div>`:''}
  </div>`,id);
 if(!open)return;
 const field=(sel,key,num)=>{const el=$(sel);if(!el)return;el.addEventListener('change',async()=>{
  const val=num?(el.value===''?null:Number(el.value)):el.value;if(await patch(id,{[key]:val},'Saved'))refreshSheet(id)})};
 field('#eQty','quantity',true);field('#eType','containerType');field('#eMat','containerMaterial');field('#eInner','innerCount',true);
 $('#dRm').onclick=async()=>{closeSheet();if(await patch(id,{removed:true}))toast('Removed '+p.product_name,'Undo',()=>patch(id,{removed:false},'Restored'))};
 $('#dOk').onclick=async()=>{const c=!p.confirmed;closeSheet();await patch(id,{confirmed:c},c?'Confirmed':'Marked as needs review')}}
function refreshSheet(id){if(sheetFor!==id)return;const y=$('#sheet').scrollTop;detail(id);$('#sheet').scrollTop=y}

load();
})();
</script>
</body>
</html>
